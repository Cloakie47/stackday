name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contracts:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge --version
      - run: forge build
      - run: forge test

  web:
    name: Web app build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The lock file is written by npm 11 (Node 24). Fall back to a normal install if it drifts.
      - run: npm ci || npm install
      # The build type-checks the app. (Running tsc on its own first fails, because Next.js
      # generates some of its types during the build.)
      - run: npm run build
      # Unit tests for the web code: Node's own test runner, no extra packages (needs Node 22.18 or later).
      - run: npm test
