[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read-write", path = "./deployments" }]
# Fork tests live in test/fork and only run with the "fork" profile.
no_match_path = "test/fork/*"

# Base mainnet fork tests: run the real stock tokens (Base native precompiles).
[profile.fork]
no_match_path = "test/none/*"
match_path = "test/fork/*"
hardfork = "base:Cobalt"

[rpc_endpoints]
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[lint]
lint_on_build = false
